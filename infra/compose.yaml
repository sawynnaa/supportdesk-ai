services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: supportdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U supportdesk]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql://supportdesk:${POSTGRES_PASSWORD}@db:5432/supportdesk
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-development}
      AI_MODE: mock
      REAL_AI_ENABLED: 'false'
      SEED_DEMO: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in your shell}
      EXTERNAL_WORKER: 'true'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: [node, dist/server/apps/worker/src/main.js]
    environment:
      DATABASE_URL: postgresql://supportdesk:${POSTGRES_PASSWORD}@db:5432/supportdesk
      AI_MODE: mock
      REAL_AI_ENABLED: 'false'
    depends_on:
      api:
        condition: service_healthy
  web:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
